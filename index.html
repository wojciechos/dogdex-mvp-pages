<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FaunaNote</title>
    <style>
      body {
        background: #f6fbf4;
        color: #17291d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
        margin: 0;
      }
      main {
        margin: 0 auto;
        max-width: 760px;
        padding: 56px 22px;
      }
      h1 {
        font-size: clamp(38px, 9vw, 64px);
        line-height: 0.98;
        margin: 0 0 12px;
      }
      p,
      a {
        color: #4b5c49;
        font-size: 17px;
      }
      a {
        font-weight: 800;
      }
      .meta {
        color: #667766;
        font-weight: 800;
        text-transform: uppercase;
      }
      .links {
        display: grid;
        gap: 12px;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="meta">FaunaNote</p>
      <h1>Identify animals. Keep every discovery.</h1>
      <p>
        FaunaNote is a free animal identification and collecting camera app. Photograph an animal, get a
        likely species result, and save the sighting to your private on-device collection.
      </p>
      <div class="links">
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./support.html">Support</a>
      </div>
    </main>
  </body>
</html>
